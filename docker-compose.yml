services:
  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tutorkhujo_client
    restart: always
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5026/api/v1}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
